name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Select the environment you want to deploy to."
        required: true
        default: staging
        options:
          - staging
          - production

jobs:
  run_tests:
    uses: ./.github/workflows/common.yml

  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [run_tests]
    if: ${{ github.event.inputs.ENVIRONMENT == 'staging' }} # Adjust as needed for production
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build the application
        run: npm run build

      - name: Copy built files to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr
          path: ./dist/ # Change this to the build folder generated by Vite
          remote_path: ${{ secrets.DEPLOYMENT_DIRECTORY }}
          remote_host: ${{ secrets.SSH_HOST_NAME }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_key: ${{ secrets.SSH_SECRET }}
          remote_user: ${{ secrets.SSH_USERNAME }}

      - name: Deploy to Droplet via SSH
        env:
          SSH_SECRET: ${{ secrets.SSH_SECRET }}
          SSH_HOST_NAME: ${{ secrets.SSH_HOST_NAME }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOYMENT_DIRECTORY: ${{ secrets.DEPLOYMENT_DIRECTORY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_SECRET" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST_NAME >> ~/.ssh/known_hosts

          # Restart Nginx using sshpass to handle the password
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST_NAME "echo $SSH_PASSWORD | sudo -S systemctl restart nginx"
